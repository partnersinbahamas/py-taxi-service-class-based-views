{% extends 'base.html' %}
{% load static %}

{% block content %}
  <table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Model</th>
        <th scope="col">Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in cars %}
        <tr>
          <th scope="row">{{ car.id }}</th>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  {% include 'includes/pagination.html' %}
{% endblock %}
